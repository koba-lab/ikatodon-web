name: Tunnel image

# トンネルのトークンを焼き込んだ cloudflared イメージを ghcr.io/koba-lab/ikatodon-tunnel に push する。
# トークンはビルドのたびに Cloudflare API から取得するので、GitHub の Secret には保存しない。
#
# パッケージが Private でないと、誰でもトークンを取り出せてしまう。そのため push の前後で
# 公開範囲を確かめ、Private でなければ失敗させる。
#
# パッケージはこのワークフローでは作らない。公開リポジトリのワークフローが作ったパッケージは、
# リポジトリの公開範囲を引き継いで Public になるため。パッケージは手元から Private で作り、
# このリポジトリに Actions access（Write）を付けておく（docs/setup.md）。

# トークン入りのイメージを push するので、自動では動かさず手で実行する
# （Dockerfile を変えたあと、トンネルの secret を変えたあとなど）。
on:
  workflow_dispatch:

concurrency:
  group: tunnel-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/koba-lab/ikatodon-tunnel
  TUNNEL_NAME: ikatodon-web

jobs:
  build:
    runs-on: ubuntu-latest
    # 手で実行するワークフローなので、承認（Required reviewers）のない専用の Environment を使う。
    # Deployment branches を main だけにしてあるので、main 以外のブランチで書き換えた
    # ワークフローからはトークンを使えない（docs/setup.md の 3）。
    environment: image-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ログインしていない状態で取得できないか（Private か）を、push の前に確かめる。
      - name: Check package is private
        run: .github/scripts/check-package.sh private

      - name: Check package exists
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/check-package.sh exists

      - name: Fetch tunnel token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_TUNNEL }}
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api() {
            curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/$1"
          }
          tunnel_id=$(api "cfd_tunnel?name=${TUNNEL_NAME}&is_deleted=false" | jq -r '.result[0].id // empty')
          if [ -z "$tunnel_id" ]; then
            echo "::error::トンネル ${TUNNEL_NAME} が見つかりません。先に Terraform を apply してください。"
            exit 1
          fi
          token=$(api "cfd_tunnel/${tunnel_id}/token" | jq -r '.result')
          echo "::add-mask::${token}"
          umask 077
          printf '%s' "$token" > "${RUNNER_TEMP}/tunnel_token"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          secret-files: |
            tunnel_token=${{ runner.temp }}/tunnel_token
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Remove token file
        if: always()
        run: rm -f "${RUNNER_TEMP}/tunnel_token"

      - name: Re-check package is private
        run: |
          if ! .github/scripts/check-package.sh private; then
            echo "::error::トークン入りのイメージが公開されている可能性があります。docs/setup.md の「トークンが漏れたとき」の手順を直ちに実行してください。"
            exit 1
          fi
