name: Terraform (cloudflare)

# このリポジトリは公開されている。Actions のログも公開されるので、
# - 秘密情報を含む変数には sensitive = true を付ける
# - plan ファイルを artifact に上げない（秘密情報が平文で入り、誰でもダウンロードできる）
# - pull_request_target は使わない（フォークの PR に Secret を渡さないため）

on:
  pull_request:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/terraform.yml'
  push:
    branches:
      - main
    paths:
      - 'cloudflare/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

# PR の plan、main の apply、main 以外のブランチからの手動実行でグループを分ける。
# 同じグループだと、待機中の main の実行が後から来た別の実行に置き換えられ、apply されないことがある。
concurrency:
  group: terraform-cloudflare-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.ref_name) }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: cloudflare

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TERRAFORM_VERSION: '1.16.7'

jobs:
  check:
    name: fmt / validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - run: terraform fmt -check -recursive -diff

      - run: terraform init -backend=false

      - run: terraform validate

  plan:
    name: plan
    needs: check
    # フォークからの PR と Dependabot の PR には Actions の Secret が渡らないので plan しない。
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Environment の設定（承認者）を確認するため
      actions: read
      # plan の結果を PR にコメントするため
      issues: write
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_READ }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      # Web サーバーの IP（カンマ区切り）。Terraform では sensitive なので plan / apply に値は出ない
      TF_VAR_web_ips: ${{ secrets.WEB_IPS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # main への push では、このあと apply が走る。Environment に承認者が設定されていないと
      # 承認なしで apply されてしまうので、その場合はここで止める。
      - name: Check approval is required for apply
        if: github.event_name != 'pull_request'
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/environments/production" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')
          if [ "$n" -eq 0 ]; then
            echo "::error::Environment production に Required reviewers が設定されていません。承認なしで apply されるのを防ぐため止めます（docs/setup.md の 3）。"
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - run: terraform init

      # state をロックしない読み取り専用の plan。ロックは concurrency で防ぐ。
      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -lock=false -no-color > "${RUNNER_TEMP}/plan.txt" 2>&1
          code=$?
          cat "${RUNNER_TEMP}/plan.txt"
          echo "code=${code}" >> "$GITHUB_OUTPUT"

      - name: Report plan
        if: always() && steps.plan.outputs.code != ''
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXTRA_NOTE: >-
            ${{ github.event_name == 'pull_request'
            && 'マージすると、この内容で apply します（承認が必要です）。'
            || format('この内容で apply します。[実行画面]({0}/{1}/actions/runs/{2}) の **Review deployments** から承認してください。', github.server_url, github.repository, github.run_id) }}
          MARKER: ${{ github.event_name == 'pull_request' && 'terraform-plan' || 'terraform-plan-main' }}
        run: |
          "${GITHUB_WORKSPACE}/.github/scripts/tf-report.sh" plan "${{ steps.plan.outputs.code }}" "${RUNNER_TEMP}/plan.txt" "$MARKER"

      - name: Fail if plan failed
        if: steps.plan.outputs.code != '0'
        run: exit 1

  apply:
    name: apply
    needs: plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Environment の required reviewers で、apply の前に人の承認を挟む。
    environment: production
    permissions:
      contents: read
      # apply の結果をマージ元の PR にコメントするため
      issues: write
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      # Web サーバーの IP（カンマ区切り）。Terraform では sensitive なので plan / apply に値は出ない
      TF_VAR_web_ips: ${{ secrets.WEB_IPS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - run: terraform init

      - name: terraform apply
        id: apply
        run: |
          set +e
          terraform apply -auto-approve -no-color > "${RUNNER_TEMP}/apply.txt" 2>&1
          code=$?
          cat "${RUNNER_TEMP}/apply.txt"
          echo "code=${code}" >> "$GITHUB_OUTPUT"

      - name: Report apply
        if: always() && steps.apply.outputs.code != ''
        run: |
          "${GITHUB_WORKSPACE}/.github/scripts/tf-report.sh" apply "${{ steps.apply.outputs.code }}" "${RUNNER_TEMP}/apply.txt" terraform-apply

      - name: Fail if apply failed
        if: steps.apply.outputs.code != '0'
        run: exit 1
